[project]
name = "site-copilot"
version = "0.1.0"
description = "Agente LLM para seleccion de ubicaciones comerciales con datos geoespaciales de INEGI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "duckdb>=1.5.6",
    "folium>=0.20.0",
    "httpx>=0.28.1",
    "openai>=3.35.1",
    "osmnx>=2.1.1",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
    "streamlit-folium>=0.27.4",
    "tqdm>=4.70.1",
]

[project.scripts]
site-copilot = "site_copilot.agent:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
