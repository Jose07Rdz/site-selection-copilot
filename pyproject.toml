[project]
name = "site-copilot"
version = "0.1.0"
description = "Agente LLM para seleccion de ubicaciones comerciales con datos geoespaciales de INEGI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
